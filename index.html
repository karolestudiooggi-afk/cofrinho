<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="description" content="Cofrinho: crie metas e registre cada valor que você guardar.">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫙</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cofrinho — minhas metas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --paper: #F3F5FB;
      --card: #FFFFFF;
      --ink: #1B2440;
      --soft: #5B6485;
      --line: #DDE2F0;
      --cobalt: #2F4BD8;
      --gold: #F2B33D;
      --gold-deep: #C98A12;
      --mint: #2FA67F;
      --rose: #D9546A;
      --glass: rgba(47, 75, 216, .06);
      --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
      --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --paper: #10152A;
        --card: #182041;
        --ink: #EEF1FB;
        --soft: #9AA3C7;
        --line: #2A3460;
        --cobalt: #7C93FF;
        --glass: rgba(124, 147, 255, .08);
      }
    }

    :root[data-theme="dark"] {
      --paper: #10152A;
      --card: #182041;
      --ink: #EEF1FB;
      --soft: #9AA3C7;
      --line: #2A3460;
      --cobalt: #7C93FF;
      --glass: rgba(124, 147, 255, .08);
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
      border-radius: 6px
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 20px 80px
    }

    /* topo */
    .top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 36px
    }

    .hello {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      line-height: 1;
      letter-spacing: -.02em;
      margin: 0
    }

    .hello small {
      display: block;
      font-family: var(--body);
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0;
      color: var(--soft);
      margin-top: 10px
    }

    .sum {
      display: flex;
      gap: 28px;
      flex-wrap: wrap
    }

    .sum div {
      min-width: 120px
    }

    .sum b {
      display: block;
      font-family: var(--display);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -.01em
    }

    .sum span {
      color: var(--soft);
      font-size: .9rem
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 12px 22px;
      font-weight: 700;
      background: var(--cobalt);
      color: #fff;
      transition: transform .12s
    }

    .btn:active {
      transform: scale(.97)
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--line)
    }

    .btn.gold {
      background: var(--gold);
      color: #2A1D00
    }

    .btn.small {
      padding: 8px 14px;
      font-size: .9rem
    }

    /* prateleira de potes */
    .shelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 22px
    }

    .jar-card {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 28px;
      padding: 18px 18px 20px;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      width: 100%
    }

    .jar-card:hover {
      border-color: var(--cobalt)
    }

    .jar-card h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.2
    }

    .jar-card .meta {
      color: var(--soft);
      font-size: .9rem
    }

    .jar-card .amt {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.35rem
    }

    .jar-card .amt em {
      font-style: normal;
      color: var(--soft);
      font-weight: 500;
      font-size: .95rem;
      font-family: var(--body)
    }

    .jar-box {
      display: flex;
      justify-content: center;
      padding: 6px 0 2px
    }

    .jar {
      width: 130px;
      height: 160px;
      overflow: visible
    }

    .done-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--mint);
      color: #fff;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: .8rem;
      font-weight: 700
    }

    .new-card {
      border-style: dashed;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      color: var(--soft);
      font-weight: 600;
      background: transparent
    }

    .new-card .plus {
      font-family: var(--display);
      font-size: 3rem;
      line-height: 1;
      color: var(--cobalt)
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      border: 1.5px dashed var(--line);
      border-radius: 28px
    }

    .empty h2 {
      font-family: var(--display);
      font-size: 1.8rem;
      margin: 0 0 8px
    }

    .empty p {
      color: var(--soft);
      margin: 0 auto 22px;
      max-width: 40ch
    }

    /* diálogos */
    dialog {
      border: 0;
      padding: 0;
      background: var(--card);
      color: var(--ink);
      border-radius: 28px;
      width: min(560px, calc(100% - 24px));
      max-height: calc(100% - 40px);
      box-shadow: 0 30px 80px rgba(10, 15, 40, .35)
    }

    dialog::backdrop {
      background: rgba(12, 16, 36, .55)
    }

    .dlg {
      padding: 24px
    }

    .dlg-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px
    }

    .dlg-head h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.6rem;
      line-height: 1.15
    }

    .x {
      background: var(--glass);
      border: 0;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      font-size: 1.2rem;
      flex: none
    }

    label {
      display: block;
      font-weight: 600;
      font-size: .92rem;
      margin-bottom: 6px
    }

    .field {
      margin-bottom: 14px
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1.5px solid var(--line);
      background: var(--paper);
      border-radius: 14px;
      padding: 11px 13px;
      outline: none
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--cobalt)
    }

    .emojis,
    .colors {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .emojis {
      max-height: 170px;
      overflow-y: auto;
      padding: 2px
    }

    .custom-emoji {
      margin-top: 10px
    }

    .custom-emoji label {
      font-weight: 500;
      color: var(--soft);
      font-size: .88rem
    }

    .custom-emoji input {
      max-width: 120px;
      font-size: 1.3rem;
      text-align: center
    }

    .emojis button {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: var(--paper);
      font-size: 1.3rem;
      cursor: pointer
    }

    .colors button {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer
    }

    .emojis button[aria-pressed="true"] {
      border-color: var(--cobalt);
      background: var(--glass)
    }

    .colors button[aria-pressed="true"] {
      border-color: var(--ink)
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 18px;
      flex-wrap: wrap
    }

    .err {
      color: var(--rose);
      font-size: .9rem;
      min-height: 1.2em;
      margin: 4px 0 0
    }

    /* detalhe */
    .detail-top {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 18px;
      align-items: center;
      margin-bottom: 18px
    }

    .detail-top .jar {
      width: 120px;
      height: 148px
    }

    .big {
      font-family: var(--display);
      font-weight: 800;
      font-size: 2rem;
      line-height: 1.05;
      letter-spacing: -.01em
    }

    .sub {
      color: var(--soft);
      font-size: .95rem
    }

    .tip {
      background: var(--glass);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: .93rem;
      margin: 6px 0 16px
    }

    .seg {
      display: inline-flex;
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 12px
    }

    .seg button {
      border: 0;
      background: transparent;
      border-radius: 999px;
      padding: 7px 16px;
      cursor: pointer;
      font-weight: 600;
      color: var(--soft)
    }

    .seg button[aria-pressed="true"] {
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .12)
    }

    .quick {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .quick button {
      border: 1.5px solid var(--line);
      background: var(--paper);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: .9rem
    }

    .hist h3 {
      font-family: var(--display);
      font-size: 1.15rem;
      margin: 22px 0 8px
    }

    .hist ul {
      list-style: none;
      margin: 0;
      padding: 0
    }

    .hist li {
      display: grid;
      grid-template-columns: 36px 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--line)
    }

    .hist .ico {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1rem;
      background: var(--glass)
    }

    .hist .v {
      font-weight: 700;
      white-space: nowrap
    }

    .hist .v.in {
      color: var(--mint)
    }

    .hist .v.out {
      color: var(--rose)
    }

    .hist .n {
      font-size: .95rem
    }

    .hist .d {
      color: var(--soft);
      font-size: .82rem
    }

    .del {
      border: 0;
      background: transparent;
      color: var(--soft);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 6px;
      border-radius: 8px
    }

    .del:hover {
      color: var(--rose)
    }

    .muted {
      color: var(--soft);
      font-size: .92rem
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap
    }

    .linkish {
      background: none;
      border: 0;
      color: var(--rose);
      cursor: pointer;
      font-weight: 600;
      padding: 6px 0
    }

    .linkish.blue {
      color: var(--cobalt)
    }

    .auth {
      min-height: calc(100vh - 40px);
      display: grid;
      place-items: center;
      padding: 20px
    }

    .auth-card {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 28px;
      padding: 30px 26px;
      width: min(420px, 100%)
    }

    .auth-card h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 2.2rem;
      line-height: 1.05;
      margin: 0 0 6px
    }

    .auth-card p.lead {
      color: var(--soft);
      margin: 0 0 22px
    }

    .auth-card .btn {
      width: 100%;
      margin-top: 6px
    }

    .auth-links {
      display: flex;
      justify-content: center;
      margin-top: 14px
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .who {
      color: var(--soft);
      font-size: .88rem;
      margin-right: 4px;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .loading {
      text-align: center;
      color: var(--soft);
      padding: 60px 0
    }

    .status {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--paper);
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: .92rem;
      opacity: 0;
      transition: .25s;
      pointer-events: none;
      z-index: 50
    }

    .status.on {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    .backup {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px
    }

    .sync {
      font-size: .85rem;
      color: var(--soft);
      margin-top: 40px;
      text-align: center
    }

    /* moeda caindo */
    .coin {
      position: fixed;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #FFE39A, var(--gold) 55%, var(--gold-deep));
      box-shadow: inset 0 0 0 3px rgba(201, 138, 18, .6);
      z-index: 100;
      pointer-events: none;
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #8A5B00;
      font-family: var(--display);
      font-size: 1rem
    }

    @keyframes drop {
      0% {
        transform: translateY(-120px) rotate(0);
        opacity: 0
      }

      15% {
        opacity: 1
      }

      80% {
        transform: translateY(0) rotate(300deg);
        opacity: 1
      }

      100% {
        transform: translateY(18px) rotate(360deg) scale(.5);
        opacity: 0
      }
    }

    .wave {
      animation: sway 4s ease-in-out infinite
    }

    @keyframes sway {

      0%,
      100% {
        transform: translateX(0)
      }

      50% {
        transform: translateX(-30px)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .wave {
        animation: none
      }

      .coin {
        display: none
      }

      .fill {
        transition: none !important
      }
    }

    @media (max-width:520px) {
      .row {
        grid-template-columns: 1fr
      }

      .detail-top {
        grid-template-columns: 96px 1fr
      }

      .detail-top .jar {
        width: 96px;
        height: 118px
      }

      .big {
        font-size: 1.6rem
      }

      .shelf {
        grid-template-columns: 1fr 1fr;
        gap: 14px
      }

      .jar {
        width: 100px;
        height: 124px
      }

      .jar-card {
        padding: 14px;
        border-radius: 22px
      }

      .jar-card h3 {
        font-size: 1.05rem
      }

      .jar-card .amt {
        font-size: 1.1rem
      }
    }
  </style>
</head>

<body>
  <section class="auth" id="authView" hidden>
    <form class="auth-card" id="authForm" novalidate>
      <div style="font-size:2.6rem">🫙</div>
      <h1 id="authTitle">Meu cofrinho</h1>
      <p class="lead" id="authLead">Entre para ver suas metas.</p>
      <div class="field" id="emailField"><label for="aEmail">E-mail</label><input id="aEmail" type="email"
          autocomplete="email" required></div>
      <div class="field"><label for="aPass" id="aPassLbl">Senha</label><input id="aPass" type="password"
          autocomplete="current-password" minlength="6" required></div>
      <p class="err" id="authErr"></p>
      <button type="submit" class="btn" id="authBtn">Entrar</button>
      <div class="auth-links" style="gap:18px;flex-wrap:wrap"><button type="button" class="linkish blue"
          id="forgotBtn">Esqueci minha senha</button><button type="button" class="linkish blue" id="switchBtn">Criar
          conta</button></div>
    </form>
  </section>
  <div class="wrap" id="appView" hidden>
    <header class="top">
      <h1 class="hello" id="hello">Meu cofrinho<small id="helloSub">Cada moeda conta. Crie uma meta e comece a encher o
          pote.</small></h1>
      <div class="top-actions"><span class="who" id="who"></span><button class="btn ghost small"
          id="logoutBtn">Sair</button></div>
      <div class="sum" id="sum" hidden>
        <div><b id="sTotal">R$ 0</b><span>guardado no total</span></div>
        <div><b id="sGoals">0</b><span id="sGoalsLbl">metas</span></div>
        <div><b id="sMonth">R$ 0</b><span>guardado este mês</span></div>
      </div>
    </header>

    <main id="main">
      <p class="loading">Abrindo seus potes…</p>
    </main>
    <p class="sync" id="sync">🔒 Suas metas ficam salvas na nuvem, protegidas pela sua senha. Só você tem acesso.</p>
    <div class="backup"><button class="btn ghost small" id="bkExport">Baixar backup</button><button
        class="btn ghost small" id="bkImport">Restaurar backup</button><input type="file" id="bkFile"
        accept="application/json,.json" hidden></div>
  </div>

  <!-- nova / editar meta -->
  <dialog id="goalDlg" aria-labelledby="goalTitle">
    <form class="dlg" id="goalForm" method="dialog" novalidate>
      <div class="dlg-head">
        <h2 id="goalTitle">Nova meta</h2><button type="button" class="x" data-close aria-label="Fechar">✕</button>
      </div>
      <div class="field"><label for="gName">Pra que você está juntando?</label><input id="gName" maxlength="40"
          placeholder="Viagem pra Maragogi, reserva de emergência…" required></div>
      <div class="row">
        <div class="field"><label for="gTarget">Quanto precisa (R$)</label><input id="gTarget" inputmode="decimal"
            placeholder="5.000,00" required></div>
        <div class="field"><label for="gDate">Até quando (opcional)</label><input id="gDate" type="date"></div>
      </div>
      <div class="field"><label>Ícone</label>
        <div class="emojis" id="emojiPick"></div>
        <div class="custom-emoji"><label for="gEmoji">Não achou? Digite ou cole um emoji</label><input id="gEmoji"
            placeholder="🧸" maxlength="12" autocomplete="off"></div>
      </div>
      <div class="field"><label>Cor do pote</label>
        <div class="colors" id="colorPick"></div>
      </div>
      <p class="err" id="goalErr"></p>
      <div class="actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button type="submit"
          class="btn" id="goalSave">Criar meta</button></div>
    </form>
  </dialog>

  <!-- detalhe da meta -->
  <dialog id="detailDlg" aria-labelledby="dTitle">
    <div class="dlg" id="detail"></div>
  </dialog>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    (() => {
      const EMOJIS = ["💰", "🛒", "🛍️", "👗", "👟", "💄", "✈️", "🏖️", "🏠", "🛋️", "🔧", "🚗", "🏍️", "🚲", "⛽", "🛟", "🏥", "💊", "🎓", "📚", "💻", "📱", "🎮", "🎧", "📷", "💍", "🎂", "🎄", "🎁", "🎉", "👶", "🐶", "🐱", "🏋️", "⚽", "🎸", "🍔", "🍕", "☕", "💳", "🧾", "📈", "🌱", "✂️", "💅", "⭐"];
      const COLORS = ["#2F4BD8", "#2FA67F", "#F2B33D", "#D9546A", "#8B5CF6", "#0EA5B7", "#F07A2B"];
      const SOURCES = { manual: "Guardei na mão", pix: "Pix", mp: "Mercado Pago", dinheiro: "Dinheiro vivo", salario: "Do salário" };
      const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
      const brl0 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
      const $ = s => document.querySelector(s);
      const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
      const parseMoney = v => { if (!v) return NaN; let s = String(v).replace(/[R$\s]/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); return Math.round(parseFloat(s) * 100) / 100; };
      const fmtDate = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; };

      let state = { goals: [] };
      const LS = "cofrinho-v1";
      // Chave pública (anon): feita para ficar no site. A proteção dos dados é feita pelas regras RLS do banco.
      const SB_URL = "https://bcmlkmbihdkyxrjlleqg.supabase.co";
      const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjbWxrbWJpaGRreXhyamxsZXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0NDg5MjIsImV4cCI6MjA3NTAyNDkyMn0.FyTd9dOdXdc4wKmmnG7Tl73UxzaKmhrPLwJCLz7v5Is";
      const sb = window.supabase.createClient(SB_URL, SB_KEY);
      const newId = () => (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
      const FAIL = "Não consegui salvar. Confira sua internet e tente de novo.";
      const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);

      // ---------- banco de dados ----------
      const rowToGoal = r => ({ id: r.id, name: r.name, emoji: r.emoji, color: r.color, target: Number(r.target), deadline: r.deadline, createdAt: r.created_at, entries: [] });
      const rowToEntry = r => ({ id: r.id, amount: Number(r.amount), type: r.type, date: r.date, source: r.source, note: r.note || "", ts: Date.parse(r.created_at) || 0 });

      async function loadAll() {
        const [g, e] = await withTimeout(Promise.all([
          sb.from("goals").select("*").order("created_at"),
          sb.from("entries").select("*").order("created_at")
        ]), 20000);
        if (g.error || e.error) throw (g.error || e.error);
        const goals = g.data.map(rowToGoal);
        const byId = Object.fromEntries(goals.map(x => [x.id, x]));
        e.data.forEach(r => { if (byId[r.goal_id]) byId[r.goal_id].entries.push(rowToEntry(r)); });
        state = { goals };
      }
      const db = {
        async addGoal(g) { const { error } = await sb.from("goals").insert({ id: g.id, name: g.name, emoji: g.emoji, color: g.color, target: g.target, deadline: g.deadline }); if (error) throw error; },
        async updateGoal(id, f) { const { error } = await sb.from("goals").update(f).eq("id", id); if (error) throw error; },
        async deleteGoal(id) { const { error } = await sb.from("goals").delete().eq("id", id); if (error) throw error; },
        async addEntry(goalId, e) { const { error } = await sb.from("entries").insert({ id: e.id, goal_id: goalId, amount: e.amount, type: e.type, date: e.date, source: e.source, note: e.note || null }); if (error) throw error; },
        async deleteEntry(id) { const { error } = await sb.from("entries").delete().eq("id", id); if (error) throw error; }
      };

      // envia metas (de backup ou do aparelho) para o banco, com ids novos
      async function uploadGoals(goals) {
        const gRows = [], eRows = [];
        for (const g of goals) {
          const gid = newId();
          gRows.push({ id: gid, name: String(g.name || "Meta").slice(0, 60), emoji: g.emoji || "💰", color: /^#[0-9A-Fa-f]{6}$/.test(g.color) ? g.color : "#2F4BD8", target: Number(g.target) || 1, deadline: g.deadline || null });
          for (const e of (g.entries || [])) {
            if (!(Number(e.amount) > 0)) continue;
            eRows.push({ id: newId(), goal_id: gid, amount: Number(e.amount), type: e.type === "out" ? "out" : "in", date: e.date || today(), source: String(e.source || "manual").slice(0, 30), note: e.note ? String(e.note).slice(0, 120) : null });
          }
        }
        if (gRows.length) { const r = await sb.from("goals").insert(gRows); if (r.error) throw r.error; }
        if (eRows.length) { const r = await sb.from("entries").insert(eRows); if (r.error) throw r.error; }
      }

      // ---------- login ----------
      let recovering = false, signingUp = false, currentUser = null;
      function showAuth(mode) {
        $("#appView").hidden = true; $("#authView").hidden = false;
        recovering = mode === "recovery";
        signingUp = mode === "signup";
        $("#authTitle").textContent = recovering ? "Nova senha" : signingUp ? "Criar conta" : "Meu cofrinho";
        $("#authLead").textContent = recovering ? "Escolha uma senha nova para entrar." : signingUp ? "Crie seu acesso para guardar suas metas na nuvem." : "Entre para ver suas metas.";
        $("#emailField").hidden = recovering;
        $("#aPassLbl").textContent = (recovering || signingUp) ? "Senha (mínimo 6 caracteres)" : "Senha";
        $("#aPass").autocomplete = (recovering || signingUp) ? "new-password" : "current-password";
        $("#authBtn").textContent = recovering ? "Salvar nova senha" : signingUp ? "Criar conta" : "Entrar";
        $("#forgotBtn").hidden = recovering || signingUp;
        $("#switchBtn").hidden = recovering;
        $("#switchBtn").textContent = signingUp ? "Já tenho conta" : "Criar conta";
        $("#authErr").textContent = "";
      }
      $("#switchBtn").onclick = () => showAuth(signingUp ? "login" : "signup");
      async function showApp(session) {
        $("#authView").hidden = true; $("#appView").hidden = false;
        $("#who").textContent = session.user.email || "";
        $("#main").innerHTML = '<p class="loading">Abrindo seus potes…</p>';
        try {
          await loadAll();
          render();
          await offerLocalImport();
        } catch (e) {
          console.warn("[Cofrinho] carregar metas:", e);
          const msg = String((e && (e.message || e.code)) || e);
          const hint = /does not exist|relation|schema cache|PGRST205/i.test(msg) ? "As tabelas não foram encontradas. Rode o script SQL no seu Supabase." : "Confira sua internet e recarregue a página.";
          $("#main").innerHTML = '<p class="loading">Não consegui carregar suas metas. ' + hint + '<br><small>' + esc(msg) + '</small></p>';
        }
      }
      async function offerLocalImport() {
        let local = null;
        try { local = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) { }
        if (!local || !Array.isArray(local.goals) || !local.goals.length) return;
        if (state.goals.length) return;
        if (!confirm(`Encontrei ${local.goals.length} meta(s) salvas neste aparelho. Quer levar para a nuvem?`)) return;
        try {
          await uploadGoals(local.goals);
          localStorage.removeItem(LS);
          await loadAll(); render(); toast("Metas enviadas para a nuvem");
        } catch (e) { toast(FAIL); }
      }
      $("#authForm").onsubmit = async ev => {
        ev.preventDefault();
        const btn = $("#authBtn"), err = $("#authErr");
        const pass = $("#aPass").value;
        err.textContent = "";
        if (recovering) {
          if (pass.length < 6) return err.textContent = "A senha precisa ter pelo menos 6 caracteres.";
          btn.disabled = true;
          const { error } = await sb.auth.updateUser({ password: pass });
          btn.disabled = false;
          if (error) return err.textContent = "Não consegui trocar a senha. Peça um link novo.";
          recovering = false; toast("Senha alterada");
          const { data } = await sb.auth.getSession(); if (data.session) { currentUser = data.session.user.id; showApp(data.session); }
          return;
        }
        const email = $("#aEmail").value.trim();
        if (!email || !pass) return err.textContent = "Preencha e-mail e senha.";
        if (signingUp) {
          if (pass.length < 6) return err.textContent = "A senha precisa ter pelo menos 6 caracteres.";
          btn.disabled = true; btn.textContent = "Criando…";
          const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: location.origin + location.pathname } });
          btn.disabled = false; btn.textContent = "Criar conta";
          if (error) return err.textContent = /registered|exists/i.test(error.message) ? "Esse e-mail já tem conta. Clique em \"Já tenho conta\"." : /signups? not allowed|disabled/i.test(error.message) ? "Novos cadastros estão desativados." : "Não consegui criar a conta: " + error.message;
          if (!data.session) { showAuth("login"); $("#aEmail").value = email; $("#authErr").textContent = ""; toast("Conta criada! Confirme pelo link que enviamos no seu e-mail."); }
          return;
        }
        btn.disabled = true; btn.textContent = "Entrando…";
        try {
          const { data, error } = await withTimeout(sb.auth.signInWithPassword({ email, password: pass }), 20000);
          if (error) {
            console.warn("[Cofrinho] login:", error);
            err.textContent = /confirm/i.test(error.message) ? "Seu e-mail ainda não foi confirmado."
              : /invalid/i.test(error.message) ? "E-mail ou senha incorretos."
                : "Não consegui entrar: " + error.message;
          } else {
            enterApp(data.session);
          }
        } catch (e) {
          console.warn("[Cofrinho] login:", e);
          err.textContent = e.message === "timeout" ? "O servidor demorou para responder. Seu projeto do Supabase pode estar pausado." : "Falha de conexão com o servidor.";
        }
        btn.disabled = false; btn.textContent = "Entrar";
      };
      $("#forgotBtn").onclick = async () => {
        const email = $("#aEmail").value.trim();

        if (!error) toast("Enviamos um link para o seu e-mail");
      };
      $("#logoutBtn").onclick = async () => { await sb.auth.signOut(); state = { goals: [] }; };

      // ---------- backup ----------
      function exportBackup() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "cofrinho-backup-" + today() + ".json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        toast("Backup baixado");
      }
      function importBackup(file) {
        const r = new FileReader();
        r.onload = async () => {
          let d;
          try { d = JSON.parse(r.result); if (!d || !Array.isArray(d.goals)) throw 0; }
          catch (e) { return toast("Esse arquivo não é um backup do Cofrinho"); }
          if (!confirm(`Adicionar ${d.goals.length} meta(s) do backup às suas metas atuais?`)) return;
          try { await uploadGoals(d.goals); await loadAll(); render(); toast("Backup restaurado"); }
          catch (e) { toast(FAIL); }
        };
        r.readAsText(file);
      }
      document.getElementById("bkExport").onclick = exportBackup;
      document.getElementById("bkImport").onclick = () => document.getElementById("bkFile").click();
      document.getElementById("bkFile").onchange = e => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ""; };

      // ---------- cálculos ----------
      const saved = g => g.entries.reduce((a, e) => a + (e.type === "out" ? -e.amount : e.amount), 0);
      const pct = g => g.target > 0 ? Math.max(0, Math.min(1, saved(g) / g.target)) : 0;
      function planTip(g) {
        const left = g.target - saved(g);
        if (left <= 0) return "Meta batida! 🎉 Você pode criar a próxima ou continuar guardando.";
        if (!g.deadline) return `Faltam ${brl.format(left)}. Coloque uma data na meta para eu calcular quanto guardar por mês.`;
        const now = new Date(); const end = new Date(g.deadline + "T23:59:59");
        const days = Math.ceil((end - now) / 86400000);
        if (days <= 0) return `O prazo passou e faltam ${brl.format(left)}. Que tal ajustar a data?`;
        const months = Math.max(1, days / 30.44);
        const perMonth = left / months, perWeek = left / Math.max(1, days / 7);
        return `Faltam ${brl.format(left)} em ${days} dias: guarde cerca de <b>${brl.format(perMonth)}/mês</b> ou <b>${brl.format(perWeek)}/semana</b>.`;
      }

      // ---------- desenho do pote ----------
      function jarSVG(g, idSuffix) {
        const p = pct(g), h = 118, top = 30 + h * (1 - p);
        const cid = "clip" + g.id + idSuffix;
        return `<svg class="jar" viewBox="0 0 130 160" aria-hidden="true">
      <defs><clipPath id="${cid}"><path d="M22 34 Q18 40 18 52 L18 138 Q18 150 30 150 L100 150 Q112 150 112 138 L112 52 Q112 40 108 34 Z"/></clipPath></defs>
      <rect x="30" y="8" width="70" height="16" rx="6" fill="${g.color}" opacity=".9"/>
      <rect x="26" y="22" width="78" height="12" rx="5" fill="${g.color}" opacity=".55"/>
      <path d="M22 34 Q18 40 18 52 L18 138 Q18 150 30 150 L100 150 Q112 150 112 138 L112 52 Q112 40 108 34 Z" fill="var(--glass)" stroke="var(--line)" stroke-width="2.5"/>
      <g clip-path="url(#${cid})">
        <g class="fill" style="transition:transform .9s cubic-bezier(.2,.8,.2,1);transform:translateY(${top}px)">
          <path class="wave" d="M-10 6 Q10 -2 30 6 T70 6 T110 6 T150 6 T190 6 L190 200 L-10 200 Z" fill="${g.color}" opacity=".35"/>
          <path d="M-10 10 Q15 2 40 10 T90 10 T140 10 T190 10 L190 200 L-10 200 Z" fill="${g.color}"/>
          ${p > 0.05 ? `<circle cx="45" cy="${Math.min(100, h * p - 10)}" r="7" fill="#fff" opacity=".22"/><circle cx="82" cy="${Math.min(60, h * p - 30)}" r="4" fill="#fff" opacity=".22"/>` : ""}
        </g>
      </g>
      <path d="M30 50 L30 120" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".35"/>
      <text x="65" y="102" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="26" fill="${p > 0.45 ? "#fff" : "var(--ink)"}">${Math.round(p * 100)}%</text>
    </svg>`;
      }

      // ---------- tela principal ----------
      function render() {
        const main = $("#main");
        const g = state.goals;
        $("#sum").hidden = g.length === 0;
        if (!g.length) {
          main.innerHTML = `<section class="empty"><div style="font-size:3rem">🫙</div><h2>Seu primeiro pote está vazio</h2><p>Dê um nome pro sonho, diga quanto ele custa e vá registrando cada valor que guardar.</p><button class="btn" id="firstGoal">Criar minha primeira meta</button></section>`;
          $("#firstGoal").onclick = () => openGoal();
          return;
        }
        const total = g.reduce((a, x) => a + saved(x), 0);
        const ym = today().slice(0, 7);
        const month = g.reduce((a, x) => a + x.entries.filter(e => e.date.startsWith(ym)).reduce((b, e) => b + (e.type === "out" ? -e.amount : e.amount), 0), 0);
        $("#sTotal").textContent = brl0.format(total);
        $("#sGoals").textContent = g.length;
        $("#sGoalsLbl").textContent = g.length === 1 ? "meta ativa" : "metas ativas";
        $("#sMonth").textContent = brl0.format(month);

        main.innerHTML = `<div class="shelf">${g.map(x => `
      <button class="jar-card" data-open="${x.id}" aria-label="Abrir meta ${esc(x.name)}">
        ${pct(x) >= 1 ? `<span class="done-badge">Batida!</span>` : ""}
        <div class="jar-box">${jarSVG(x, "c")}</div>
        <h3>${x.emoji} ${esc(x.name)}</h3>
        <div class="amt">${brl0.format(saved(x))} <em>de ${brl0.format(x.target)}</em></div>
        <div class="meta">${x.deadline ? `Até ${fmtDate(x.deadline)}` : "Sem prazo"} · ${x.entries.length} registro${x.entries.length === 1 ? "" : "s"}</div>
      </button>`).join("")}
      <button class="jar-card new-card" id="newGoal"><span class="plus">+</span>Nova meta</button>
    </div>`;
        main.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openDetail(b.dataset.open));
        $("#newGoal").onclick = () => openGoal();
      }

      // ---------- criar / editar meta ----------
      let pick = { emoji: EMOJIS[0], color: COLORS[0] }, editingId = null;
      function drawPickers() {
        $("#emojiPick").innerHTML = EMOJIS.map(e => `<button type="button" aria-pressed="${e === pick.emoji}" data-e="${e}" aria-label="Ícone ${e}">${e}</button>`).join("");
        $("#colorPick").innerHTML = COLORS.map(c => `<button type="button" aria-pressed="${c === pick.color}" data-c="${c}" style="background:${c}" aria-label="Cor ${c}"></button>`).join("");
        $("#emojiPick").querySelectorAll("button").forEach(b => b.onclick = () => { pick.emoji = b.dataset.e; $("#gEmoji").value = ""; drawPickers(); });
        $("#colorPick").querySelectorAll("button").forEach(b => b.onclick = () => { pick.color = b.dataset.c; drawPickers(); });
      }
      function firstGrapheme(t) {
        t = (t || "").trim(); if (!t) return "";
        if (window.Intl && Intl.Segmenter) { for (const g of new Intl.Segmenter("pt", { granularity: "grapheme" }).segment(t)) return g.segment; }
        return Array.from(t)[0];
      }
      $("#gEmoji").addEventListener("input", e => {
        const g = firstGrapheme(e.target.value);
        if (g) { pick.emoji = g; drawPickers(); }
      });
      function openGoal(id) {
        editingId = id || null;
        const g = id ? state.goals.find(x => x.id === id) : null;
        $("#goalTitle").textContent = g ? "Editar meta" : "Nova meta";
        $("#goalSave").textContent = g ? "Salvar alterações" : "Criar meta";
        $("#gName").value = g ? g.name : "";
        $("#gTarget").value = g ? String(g.target).replace(".", ",") : "";
        $("#gDate").value = g ? (g.deadline || "") : "";
        pick = g ? { emoji: g.emoji, color: g.color } : { emoji: EMOJIS[0], color: COLORS[state.goals.length % COLORS.length] };
        $("#gEmoji").value = (g && !EMOJIS.includes(g.emoji)) ? g.emoji : "";
        $("#goalErr").textContent = "";
        drawPickers();
        if ($("#detailDlg").open) $("#detailDlg").close();
        $("#goalDlg").showModal();
        setTimeout(() => $("#gName").focus(), 50);
      }
      $("#goalForm").onsubmit = async e => {
        e.preventDefault();
        const name = $("#gName").value.trim(), target = parseMoney($("#gTarget").value), deadline = $("#gDate").value || null;
        if (!name) return $("#goalErr").textContent = "Dê um nome para a meta.";
        if (!(target > 0)) return $("#goalErr").textContent = "Informe um valor maior que zero, como 1500 ou 1.500,00.";
        const btn = $("#goalSave"); btn.disabled = true;
        try {
          if (editingId) {
            const f = { name, target, deadline, emoji: pick.emoji, color: pick.color };
            await db.updateGoal(editingId, f);
            Object.assign(state.goals.find(x => x.id === editingId), f);
            toast("Meta atualizada");
          } else {
            const g = { id: newId(), name, target, deadline, emoji: pick.emoji, color: pick.color, createdAt: today(), entries: [] };
            await db.addGoal(g);
            state.goals.push(g);
            toast("Meta criada. Agora é só encher o pote!");
          }
        } catch (err) { btn.disabled = false; return $("#goalErr").textContent = FAIL; }
        btn.disabled = false;
        render(); $("#goalDlg").close();
        if (editingId) openDetail(editingId);
      };

      // ---------- detalhe e registros ----------
      let mode = "in";
      function openDetail(id) {
        const g = state.goals.find(x => x.id === id); if (!g) return;
        const d = $("#detail");
        const s = saved(g);
        const entries = [...g.entries].sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
        d.innerHTML = `
      <div class="dlg-head"><h2 id="dTitle">${g.emoji} ${esc(g.name)}</h2><button type="button" class="x" data-close aria-label="Fechar">✕</button></div>
      <div class="detail-top">
        <div id="dJar">${jarSVG(g, "d")}</div>
        <div><div class="big">${brl.format(s)}</div><div class="sub">de ${brl.format(g.target)}${g.deadline ? ` · até ${fmtDate(g.deadline)}` : ""}</div></div>
      </div>
      <div class="tip">${planTip(g)}</div>

      <div class="seg" role="group" aria-label="Tipo de registro">
        <button type="button" data-mode="in" aria-pressed="${mode === "in"}">Guardei</button>
        <button type="button" data-mode="out" aria-pressed="${mode === "out"}">Tirei</button>
      </div>
      <form id="entryForm" novalidate>
        <div class="row">
          <div class="field"><label for="eAmt">Valor (R$)</label><input id="eAmt" inputmode="decimal" placeholder="50,00"></div>
          <div class="field"><label for="eDate">Data</label><input id="eDate" type="date" value="${today()}"></div>
        </div>
        <div class="quick" aria-label="Valores rápidos">${[10, 20, 50, 100, 200].map(v => `<button type="button" data-q="${v}">+${v}</button>`).join("")}</div>
        <div class="row">
          <div class="field"><label for="eSrc">De onde veio</label><select id="eSrc">${Object.entries(SOURCES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
          <div class="field"><label for="eNote">Anotação (opcional)</label><input id="eNote" maxlength="60" placeholder="Troco do mercado, freela…"></div>
        </div>
        <p class="err" id="eErr"></p>
        <button type="submit" class="btn ${mode === "in" ? "gold" : ""}" id="eSave" style="width:100%">${mode === "in" ? "Guardar no pote" : "Registrar retirada"}</button>
      </form>

      <section class="hist">
        <h3>Histórico</h3>
        ${entries.length ? `<ul>${entries.map(e => `
          <li>
            <span class="ico">${e.type === "out" ? "↩︎" : "🪙"}</span>
            <span><span class="n">${esc(e.note || SOURCES[e.source] || "Registro")}</span><br><span class="d">${fmtDate(e.date)} · ${SOURCES[e.source] || ""}</span></span>
            <span class="v ${e.type}">${e.type === "out" ? "−" : "+"}${brl.format(e.amount)}</span>
            <button class="del" data-del="${e.id}" aria-label="Apagar registro de ${brl.format(e.amount)}">✕</button>
          </li>`).join("")}</ul>` : `<p class="muted">Nenhum registro ainda. O primeiro valor que você guardar aparece aqui.</p>`}
      </section>

      <div class="footer-row">
        <button class="linkish blue" id="editGoal">Editar meta</button>
        <button class="linkish" id="delGoal">Apagar meta</button>
      </div>`;

        d.querySelector("[data-close]").onclick = () => $("#detailDlg").close();
        d.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; openDetail(id); });
        d.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
          const cur = parseMoney($("#eAmt").value) || 0;
          $("#eAmt").value = String(cur + Number(b.dataset.q)).replace(".", ",");
        });
        d.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
          if (!confirm("Apagar este registro?")) return;
          try { await db.deleteEntry(b.dataset.del); } catch (e) { return toast(FAIL); }
          g.entries = g.entries.filter(e => e.id !== b.dataset.del);
          render(); openDetail(id); toast("Registro apagado");
        });
        $("#editGoal").onclick = () => openGoal(id);
        $("#delGoal").onclick = async () => {
          if (!confirm(`Apagar a meta "${g.name}" e todo o histórico dela? Isso não pode ser desfeito.`)) return;
          try { await db.deleteGoal(id); } catch (e) { return toast(FAIL); }
          state.goals = state.goals.filter(x => x.id !== id);
          render(); $("#detailDlg").close(); toast("Meta apagada");
        };
        $("#entryForm").onsubmit = async ev => {
          ev.preventDefault();
          const amount = parseMoney($("#eAmt").value);
          if (!(amount > 0)) return $("#eErr").textContent = "Digite um valor maior que zero.";
          const date = $("#eDate").value || today();
          if (mode === "out" && amount > saved(g) + 0.001) return $("#eErr").textContent = `Você só tem ${brl.format(saved(g))} nesse pote.`;
          const before = pct(g);
          const entry = { id: newId(), ts: Date.now(), amount, date, type: mode, source: $("#eSrc").value, note: $("#eNote").value.trim() };
          const sbtn = $("#eSave"); sbtn.disabled = true;
          try { await db.addEntry(g.id, entry); } catch (e) { sbtn.disabled = false; return $("#eErr").textContent = FAIL; }
          g.entries.push(entry);
          render();
          if (!$("#detailDlg").open) $("#detailDlg").showModal();
          const jarEl = $("#dJar");
          if (mode === "in") dropCoin(jarEl);
          openDetail(id);
          const after = pct(g);
          if (after >= 1 && before < 1) toast("Meta batida! Parabéns 🎉");
          else toast(mode === "in" ? `+${brl.format(amount)} no pote` : `Retirada de ${brl.format(amount)} registrada`);
          mode = "in";
        };
        if (!$("#detailDlg").open) $("#detailDlg").showModal();
      }

      function dropCoin(anchor) {
        if (!anchor || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const r = anchor.getBoundingClientRect();
        const c = document.createElement("div");
        c.className = "coin"; c.textContent = "$";
        c.style.left = (r.left + r.width / 2 - 17) + "px";
        c.style.top = (r.top + r.height * 0.45) + "px";
        c.style.animation = "drop .9s cubic-bezier(.4,0,.6,1) forwards";
        $("#detailDlg").appendChild(c);
        setTimeout(() => c.remove(), 950);
      }

      let tt;
      function toast(msg) { const s = $("#status"); s.textContent = msg; s.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => s.classList.remove("on"), 2200); }

      document.addEventListener("click", e => { const b = e.target.closest("#goalDlg [data-close]"); if (b) $("#goalDlg").close(); });
      ["goalDlg", "detailDlg"].forEach(id => $("#" + id).addEventListener("click", e => { if (e.target.id === id) e.target.close(); }));

      function enterApp(session) {
        if (!session) return;
        if (session.user.id === currentUser) return;
        currentUser = session.user.id;
        showApp(session);
      }
      // Regra do Supabase: nada de chamadas ao banco direto dentro deste aviso, senão trava.
      sb.auth.onAuthStateChange((event, session) => {
        setTimeout(() => {
          if (event === "PASSWORD_RECOVERY") return showAuth("recovery");
          if (recovering) return;
          if (event === "SIGNED_IN") enterApp(session);
          if (event === "SIGNED_OUT") { currentUser = null; showAuth(); }
        }, 0);
      });
      (async () => {
        try {
          const { data } = await withTimeout(sb.auth.getSession(), 15000);
          if (recovering) return;
          if (data.session) enterApp(data.session); else showAuth();
        } catch (e) { showAuth(); $("#authErr").textContent = "O servidor não respondeu. Confira sua internet e recarregue a página."; }
      })();
    })();
  </script>
</body>

</html>
